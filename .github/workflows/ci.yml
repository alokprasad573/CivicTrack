name: CivicTrack Continuous Integration (CI)

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ========================================================
  # Job 1: Static Analysis, Linting & Workspace Typechecks
  # ========================================================
  quality-gate:
    name: Code Quality & Typecheck Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Contracts
        run: npm run build --workspace=@civictrack/contracts

      - name: Workspace Typecheck Gate (@civictrack/contracts, @civictrack/server, @civictrack/web)
        run: npm run typecheck

      - name: Workspace Lint Gate
        run: npm run lint

  # ========================================================
  # Job 2: Deterministic Backend Security & Workflow Tests
  # ========================================================
  backend-tests:
    name: Backend Test Suites & Domain Security
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Contracts
        run: npm run build --workspace=@civictrack/contracts

      - name: Run Deterministic Backend Tests
        run: npm test --workspace=@civictrack/server
        env:
          NODE_ENV: test
          STAFF_JWT_ACCESS_SECRET: test_jwt_access_secret_deterministic_testing_32char_key!
          STAFF_JWT_REFRESH_SECRET: test_jwt_refresh_secret_deterministic_testing_32char_key!
          ENABLE_TEST_RATE_LIMIT: "false"

  # ========================================================
  # Job 3: Monorepo Production Build Verification
  # ========================================================
  build-gate:
    name: Production Build Verification
    runs-on: ubuntu-latest
    needs: [quality-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Setup Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/apps/web/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/src/**.[jt]s', 'apps/web/src/**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build Monorepo Workspaces
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          INTERNAL_API_URL: http://localhost:4000

  # ========================================================
  # Job 4: Container Build Smoke Test
  # ========================================================
  docker-smoke-test:
    name: Docker Container Build Verification
    runs-on: ubuntu-latest
    needs: [backend-tests, build-gate]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: civictrack-server:test

      - name: Build Web Docker Image (Smoke Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: civictrack-web:test
